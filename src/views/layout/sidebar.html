<aside id="app-sidebar" class="sidebar" data-side="left" hx-swap-oob="true">
  <nav aria-label="Sidebar navigation">
    <section class="scrollbar-sm">
      <div class="relative flex items-center text-lg gap-2 p-4 lg:text-xl lg:mt-1">
        <iconify-icon icon="fluent:animal-paw-print-20-filled"></iconify-icon>
        <a href="/dashboard" class="font-semibold" hx-get="/dashboard" hx-target="#content" hx-swap="innerHTML"
          hx-push-url="true">
          <span class="absolute inset-0"></span>
          Pet Shelter
        </a>
      </div>

      <div role="group" aria-labelledby="group-label-content-1">
        <ul>
          <% it.navLinks.forEach(function(link) { %>
            <li>
              <a href="<%= link.url %>" hx-get="<%= link.url %>" hx-target="#content" hx-swap="innerHTML" hx-push-url="true"<% if (it.currentPath.includes(link.url)) { %> class="bg-sidebar-primary text-sidebar"<% } %>>
                <iconify-icon icon="<%= it.currentPath === link.url ? link.iconSolid : link.icon %>"></iconify-icon>
                <span><%= link.title %></span>
              </a>
            </li>
          <% }) %>
        </ul>
      </div>
    </section>
  </nav>
</aside>
