<div class="flex items-center justify-between">
  <h1 class="text-3xl font-bold mb-6">Our Pets</h1>

  <%~ include('_filters') %>
</div>

<div id="pet-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
  <% it.pets.forEach(function(pet) { %>
    <%~ include('_pet', { pet }) %>
    <% }) %>
</div>

<% if (it.pets.length===0) { %>
  <p class="text-center text-gray-500 mt-8">No pets match your filters.</p>
  <% } %>
